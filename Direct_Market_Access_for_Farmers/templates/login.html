{% extends "base.html" %}
{% block title %}Sign In | FarmDirect{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2 data-i18n="login_title">Welcome Back</h2>
    <p data-i18n="login_sub">Sign in to access your farm portal or buyer account</p>

    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label for="email" data-i18n="lbl_email">Email Address</label>
        <input type="email" id="email" name="email" class="input-field" placeholder="name@example.com" data-i18n="ph_email" required>
      </div>

      <div class="form-group">
        <label for="password" data-i18n="lbl_password">Password</label>
        <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" data-i18n="ph_password" required>
      </div>

      <button type="submit" class="btn" style="width: 100%; margin-top: 10px;" data-i18n="btn_login">Sign In</button>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 0.88rem; color: var(--muted);">
      <span data-i18n="no_account_text">Don't have an account yet?</span> <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 700;" data-i18n="join_now_link">Join Now</a>
    </div>
  </div>
</div>
{% endblock %}
